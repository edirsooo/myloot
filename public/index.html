<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyLoot</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#070b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyLoot">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/skin.css">
<link rel="stylesheet" href="/celular.css">
<link rel="stylesheet" href="/pet.css">
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>

<div id="app">
  <aside id="side">
    <div class="brand">
      <div class="cube" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div><b>MYLOOT</b><small>seu inventário</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="btn big" id="btnNew">＋ Novo item <kbd>N</kbd></button>
      <button class="btn ghost" id="btnVoz">🎙️ Criar por voz <kbd>V</kbd></button>
      <button class="btn ghost" id="btnSearch">🔍 Buscar <kbd>Ctrl K</kbd></button>
      <button class="side-upd" id="btnUpd" hidden></button>
      <button class="side-bug side-hist" data-hist>🕘 Histórico de ações</button>
      <button class="side-bug" id="btnBug">🐞 Reportar um problema</button>
      <a class="credit" href="https://prestesdesign.com.br" target="_blank" rel="noopener" title="Conheça a Prestes Design"><img src="/prestes.png" alt=""><span>feito por <b>prestes design</b></span></a>
    </div>
  </aside>

  <main id="main">
    <header id="hud">
      <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
      <button class="icon-btn nav-h" id="navVolta" title="Voltar para a tela anterior (Alt + ←)" aria-label="Voltar para a tela anterior" disabled>←</button>
      <button class="icon-btn nav-h" id="navAvanca" title="Avançar (Alt + →)" aria-label="Avançar" disabled>→</button>
      <div class="hud-title" id="pageTitle"></div>
      <button class="tour-btn" id="tourBtn" title="Rever o tutorial desta tela" aria-label="Rever o tutorial desta tela" hidden><i>?</i><span>Tutorial</span></button>
      <div class="hud-grow"></div>
      <div class="focus" id="focus" title="Timer de foco: clique para começar. Role a bolinha do mouse para mudar o tempo."><span class="dot"></span>⏱ <b id="focusT">25:00</b> <span class="lb">foco</span></div>
      <button type="button" class="hud-chip hud-hist" id="histBtn" title="Histórico de ações: desfazer e refazer (Ctrl + Z desfaz a última)" aria-label="Histórico de ações">🕘</button>
      <div class="mus" id="mus">
        <button type="button" class="hud-chip hud-mus" id="musBtn" title="Música de fundo" aria-label="Música de fundo" aria-haspopup="dialog" aria-expanded="false" aria-pressed="false">🔈</button>
        <div class="mus-pop" id="musPop" role="dialog" aria-label="Música de fundo" hidden>
          <div class="mus-topo"><span class="mus-lab">Música de fundo</span><span class="mus-cont" id="musCont"></span></div>
          <div class="mus-nome" id="musNome">…</div>
          <div class="mus-ctl"><button type="button" data-m="ant" title="Música anterior" aria-label="Música anterior">⏮</button><button type="button" data-m="play" id="musPlay" class="play" title="Tocar" aria-label="Tocar ou pausar">▶</button><button type="button" data-m="prox" title="Próxima música" aria-label="Próxima música">⏭</button><button type="button" data-m="loop" id="musLoop" class="rep" title="Repetir só esta música" aria-label="Repetir só esta música" aria-pressed="false">🔁</button></div>
          <label class="mus-vol"><span aria-hidden="true">🔉</span><input type="range" id="musVol" min="0" max="1" step="0.05" value="0.2" aria-label="Volume da música"><b id="musPct">20%</b></label>
        </div>
      </div>
      <div class="hud-chip" id="hudStreak" title="Dias seguidos">🔥 <b>0</b></div>
      <div class="hud-goal" id="hudGoal"><span class="hg-lab">Meta do dia<small id="goalTxt"></small></span><div class="slots" id="goalSlots"></div></div>
      <div class="hud-level" id="hudLevel">
        <div class="lvl-badge" id="lvlBadge">1</div>
        <div class="lvl-info"><b id="lvlName">Novato</b><div class="xpbar" id="xpbar"></div><small id="xpText">0 XP</small></div>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>

<div id="overlay"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="saveState" class="save-state" role="alert" hidden></div>
<div id="ctx" class="ctx" hidden></div>
<div id="dropHint" hidden><div>📥 Solte aqui para criar um item com o arquivo</div></div>
<div id="levelup" hidden></div>

<script src="/sfx.js"></script>
<script src="/fx.js"></script>
<script src="/core.js"></script>
<script src="/opcoes.js"></script>
<script src="/ui.js"></script>
<script src="/library.js"></script>
<script src="/pastas.js"></script>
<script src="/trello.js"></script>
<script src="/notion.js"></script>
<script src="/reader.js"></script>
<script src="/editor.js"></script>
<script src="/tasks.js"></script>
<script src="/pages.js"></script>
<script src="/home.js"></script>
<script src="/graph.js"></script>
<script src="/integra.js"></script>
<script src="/ia.js"></script>
<script src="/atualiza.js"></script>
<script src="/ferramentas.js"></script>
<script src="/celular.js"></script>
<script src="/clientes.js"></script>
<script src="/extras.js"></script>
<script src="/financeiro.js"></script>
<script src="/voz.js"></script>
<script src="/rotina.js"></script>
<script src="/conexoes.js"></script>
<script src="/suporte.js"></script>
<script src="/historico.js"></script>
<script src="/musica.js"></script>
<script src="/tour.js"></script>
<script src="/pet.js"></script>
<script src="/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyLoot</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#070b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyLoot">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/skin.css">
<link rel="stylesheet" href="/celular.css">
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>

<div id="app">
  <aside id="side">
    <div class="brand">
      <div class="cube" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div><b>MYLOOT</b><small>seu inventário</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="btn big" id="btnNew">＋ Novo item <kbd>N</kbd></button>
      <button class="btn ghost" id="btnSearch">🔍 Buscar <kbd>Ctrl K</kbd></button>
      <a class="credit" href="https://prestesdesign.com.br" target="_blank" rel="noopener" title="Conheça a Prestes Design"><img src="/prestes.png" alt=""><span>feito por <b>prestes design</b></span></a>
    </div>
  </aside>

  <main id="main">
    <header id="hud">
      <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
      <div class="hud-title" id="pageTitle"></div>
      <div class="hud-grow"></div>
      <div class="focus" id="focus" title="Timer de foco: 25 minutos valem XP"><span class="dot"></span>⏱ <b id="focusT">25:00</b> <span class="lb">foco</span></div>
      <div class="hud-chip" id="hudStreak" title="Dias seguidos">🔥 <b>0</b></div>
      <div class="hud-goal" id="hudGoal"><span>META</span><div class="slots" id="goalSlots"></div></div>
      <div class="hud-level" id="hudLevel">
        <div class="lvl-badge" id="lvlBadge">1</div>
        <div class="lvl-info"><b id="lvlName">Novato</b><div class="xpbar" id="xpbar"></div><small id="xpText">0 XP</small></div>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>

<div id="overlay"></div>
<div id="toasts"></div>
<div id="ctx" class="ctx" hidden></div>
<div id="dropHint" hidden><div>📥 Solte aqui para criar um item com o arquivo</div></div>
<div id="levelup" hidden></div>

<script src="/sfx.js"></script>
<script src="/fx.js"></script>
<script src="/core.js"></script>
<script src="/ui.js"></script>
<script src="/library.js"></script>
<script src="/reader.js"></script>
<script src="/editor.js"></script>
<script src="/tasks.js"></script>
<script src="/pages.js"></script>
<script src="/home.js"></script>
<script src="/graph.js"></script>
<script src="/integra.js"></script>
<script src="/ia.js"></script>
<script src="/atualiza.js"></script>
<script src="/ferramentas.js"></script>
<script src="/qr.js"></script>
<script src="/celular.js"></script>
<script src="/clientes.js"></script>
<script src="/extras.js"></script>
<script src="/main.js"></script>
</body>
</html>
